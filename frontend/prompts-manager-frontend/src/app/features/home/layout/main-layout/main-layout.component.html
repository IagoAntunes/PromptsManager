<div class="dashboard-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed">
  
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="assets/text_logo.svg" alt="Logo" class="logo-full">
      <img src="assets/ic_logo.svg" alt="Icon" class="logo-icon"> 
    </div>

    <div class="px-3 mb-3">
      <a routerLink="/home/prompt/new" class="btn btn-primary w-100 btn-new-prompt">
        <i class="bi bi-plus-lg"></i>
        <span>Novo Prompt</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav flex-column" *ngIf="!isSidebarCollapsed">
        <li class="nav-item" *ngFor="let prompt of prompts$ | async">
          <a class="nav-link d-flex align-items-center justify-content-between" routerLink="/home/prompt/{{prompt.id}}" routerLinkActive="active">
            <div class="nav-text">
              <div class="nav-title">{{prompt.title}}</div>
              <div class="nav-subtitle">{{prompt.description}}</div>
            </div>
            <button
              type="button"
              class="btn btn-icon btn-delete"
              (click)="$event.preventDefault(); $event.stopPropagation(); deletePrompt(prompt.id)"
              aria-label="Excluir prompt">
              <i class="bi bi-trash"></i>
            </button>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-toggle" (click)="toggleSidebar()">
        <i class="bi bi-chevron-bar-left"></i>
        <span>Recolher</span>
      </button>
    </div>
  </aside>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>
